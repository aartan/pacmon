<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Pacmon: package monitoring. Monochrome print: paper, ink cube, signal pulse. -->
  <rect width="1024" height="1024" fill="#f6f7f9"/>

  <!-- package cube (ink) -->
  <g fill="none" stroke="#161a20" stroke-width="44" stroke-linejoin="round">
    <path d="M512 200 L784 348 L512 496 L240 348 Z"/>
    <path d="M240 348 V640"/>
    <path d="M512 496 V788"/>
    <path d="M784 348 V640"/>
    <path d="M240 640 L512 788 L784 640"/>
  </g>

  <!-- monitor pulse (signal green) -->
  <path
    d="M188 596 H424 L472 524 L528 668 L584 524 L632 596 H836"
    fill="none"
    stroke="#059669"
    stroke-width="42"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
