appId: site.aartan.guardrail
productName: Guardrail
copyright: Copyright © 2026 Abdifatah Artan

directories:
  buildResources: build
  output: release

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!tests/*'
  - '!scripts/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'

asarUnpack:
  - node_modules/cve-lite-cli/**
  - node_modules/fflate/**
  - node_modules/semver/**
  - node_modules/yaml/**
  - node_modules/yarn-lockfile/**
  - node_modules/@yarnpkg/**

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.png
  darkModeSupport: true

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
  icon: build/icon.png
  category: Development
  syncDesktopName: true
  maintainer: Abdifatah Artan <abdifatah.artan@outlook.com>
  synopsis: Local-first vulnerability scanning and remediation

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1

rpm:
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - libXtst
    - xdg-utils
    - libuuid

appImage:
  artifactName: ${name}-${version}.${ext}

npmRebuild: false
electronDownload:
  mirror: https://github.com/electron/electron/releases/download/
